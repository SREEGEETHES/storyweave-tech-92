# ⚠  DO NOT commit real values — use `kubectl create secret` or Sealed Secrets
# Example only: replace <base64-encoded-value> with real encoded secrets.
# Generate: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: storyweave-secrets
  namespace: storyweave
type: Opaque
data:
  JWT_SECRET: <base64-encoded-value>
  NEON_DATABASE_URL: <base64-encoded-value>
  AWS_ACCESS_KEY_ID: <base64-encoded-value>
  AWS_SECRET_ACCESS_KEY: <base64-encoded-value>
  S3_BUCKET_NAME: <base64-encoded-value>
  ANTHROPIC_API_KEY: <base64-encoded-value>
  GPU_SERVER_API_KEY: <base64-encoded-value>
  REMOTION_LAMBDA_FUNCTION_NAME: <base64-encoded-value>
  REMOTION_SERVE_URL: <base64-encoded-value>
  RENDER_WEBHOOK_SECRET: <base64-encoded-value>
