apiVersion: v1
kind: ConfigMap
metadata:
  name: storyweave-config
  namespace: storyweave
data:
  NODE_ENV: "production"
  PORT_API: "3001"
  PORT_GPU: "8000"
  AWS_REGION: "us-east-1"
  WHISPER_MODEL_SIZE: "large-v3"
  QWEN_TTS_MODEL: "Qwen/Qwen3-TTS"
  SEEDREAM_MODEL: "ByteDance-Seed/Seedream-3-0"
  # Internal service URLs (resolved by kube-dns)
  REDIS_URL: "redis://redis-service:6379"
  GPU_SERVER_URL: "http://gpu-server-service:8000"
