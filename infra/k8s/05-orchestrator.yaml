---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: storyweave
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: storyweave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      terminationGracePeriodSeconds: 60  # Allow in-flight jobs to drain
      containers:
        - name: orchestrator
          image: <ECR_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/storyweave/orchestrator:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: storyweave-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: storyweave-secrets
                  key: ANTHROPIC_API_KEY
            - name: NEON_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: storyweave-secrets
                  key: NEON_DATABASE_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: storyweave-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: storyweave-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: storyweave-secrets
                  key: S3_BUCKET_NAME
            - name: GPU_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: storyweave-secrets
                  key: GPU_SERVER_API_KEY
            - name: REMOTION_LAMBDA_FUNCTION_NAME
              valueFrom:
                secretKeyRef:
                  name: storyweave-secrets
                  key: REMOTION_LAMBDA_FUNCTION_NAME
            - name: REMOTION_SERVE_URL
              valueFrom:
                secretKeyRef:
                  name: storyweave-secrets
                  key: REMOTION_SERVE_URL
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
